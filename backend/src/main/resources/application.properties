# ==========================================
# Konfigurasi Server
# ==========================================
server.port=8080

# ==========================================
# Konfigurasi Database MySQL
# ==========================================
# Placeholder ${VAR:default} memungkinkan override via environment variable,
# atau menggunakan nilai default localhost jika tidak disetel.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:db_karyawan}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Jakarta
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# Konfigurasi Hibernate JPA
# ==========================================
# 'update': Hibernate akan otomatis membuat tabel jika belum ada, atau menyesuaikan kolom baru
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
